services:
  db:
    image: postgres:15-alpine
    container_name: gds_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/versuion
    container_name: gds_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PHOTOS_DIR: /app/photos
      # Origines des frontends autorisées par le CORS (localhost et 127.0.0.1, tous ports)
      APP_CORS_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*,http://[::1]:*
    volumes:
      - photos_data:/app/photos
    ports:
      - "8089:8089"

  frontend:
    build:
      context: ./frontend/my-first-project
      args:
        NG_APP_API_URL: http://localhost:8089/gestiondestock
    container_name: gds_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

  frontend-next:
    build:
      context: ./frontend/stock-ui
    container_name: gds_frontend_next
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3009:3000"  # 3000 (Metabase) et 3001-3008 sont occupés sur cette machine

  adminer:
    image: adminer:latest
    container_name: gds_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"

volumes:
  db_data:
  photos_data:
