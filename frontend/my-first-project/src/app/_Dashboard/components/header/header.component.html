<div class="flex w-full items-center gap-3">
  <div class="position-relative min-w-0 flex-1">
    <label class="input-group input-group-sm w-full">
      <input type="text" class="input input-bordered input-sm w-full"
             placeholder="Rechercher un article (désignation ou code)…"
             aria-label="Recherche" [(ngModel)]="recherche" (ngModelChange)="onRecherche()"
             (focus)="afficherSuggestions = suggestions.length > 0"
             (blur)="fermerSuggestionsPlusTard()">
      <span class="input-group-text bg-base-300"><i class="fas fa-search"></i></span>
    </label>

    <div class="suggestions shadow" *ngIf="afficherSuggestions && suggestions.length > 0">
      <button type="button" class="suggestion-item" *ngFor="let a of suggestions" (mousedown)="ouvrirArticle(a)">
        <i class="fas fa-box mr-2 text-base-content/50"></i>
        <b>{{a.codeArticle}}</b> — {{a.designation}}
      </button>
      <button type="button" class="suggestion-item suggestion-tous" (mousedown)="voirTousLesResultats()">
        Voir tous les articles →
      </button>
    </div>
  </div>
  <span class="hidden shrink-0 text-sm text-base-content/70 sm:inline">
    Bonjour {{connectedUser.nom}}
  </span>
</div>
