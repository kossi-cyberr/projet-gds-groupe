<footer class="app-footer">
  <div class="row align-items-center w-100 mx-0">
    <div class="col-md-4 text-center text-md-left mb-1 mb-md-0">
      <span class="footer-brand"><i class="fas fa-boxes"></i> Gestion de Stock</span>
      <span class="text-muted ml-2">v1.0</span>
    </div>
    <div class="col-md-4 text-center mb-1 mb-md-0">
      <span class="text-muted small" *ngIf="entreprise?.nom">
        <i class="fas fa-building mr-1"></i>{{entreprise?.nom}}
        <span *ngIf="entreprise?.codefiscale"> · N° {{entreprise?.codefiscale}}</span>
      </span>
      <span class="text-muted small" *ngIf="!entreprise?.nom">Multi-entreprise · Données sécurisées</span>
    </div>
    <div class="col-md-4 text-center text-md-right">
      <span class="text-muted small mr-3">
        <i class="fas fa-user-shield mr-1"></i>{{connectedUserNom()}}
      </span>
      <span class="text-muted small">© {{annee}} — Tous droits réservés</span>
    </div>
  </div>
</footer>
