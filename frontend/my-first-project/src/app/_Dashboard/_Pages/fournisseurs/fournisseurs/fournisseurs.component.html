<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <div>
    <h1 class="page-title mb-0">Fournisseurs</h1>
    <p class="helper-text mb-0">Gérez vos fournisseurs</p>
  </div>
  <button type="button" class="btn btn-primary btn-sm" (click)="noveauFournissuer()">
    <i-lucide name="plus" size="16"></i-lucide>
    Nouveau fournisseur
  </button>
</div>

<app-confirm-dialog
  [ouvert]="suppressionOuverte"
  titre="Supprimer le fournisseur"
  [message]="messageSuppression"
  libelleConfirmer="Supprimer"
  (confirme)="confirmerSuppression()"
  (annule)="annulerSuppression()">
</app-confirm-dialog>

<app-data-table
  entite="fournisseur"
  [colonnes]="colonnes"
  [lignes]="listFournisseur"
  [chargement]="chargement"
  [erreur]="errorMsg !== ''"
  [erreurMessage]="errorMsg || 'Erreur lors du chargement des fournisseurs.'"
  (creer)="noveauFournissuer()"
  (reessayer)="findAllFournisseurs()"
  (action)="surAction($event)">
</app-data-table>
