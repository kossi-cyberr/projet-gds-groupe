<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <div>
    <h1 class="page-title mb-0">Catégories</h1>
    <p class="helper-text mb-0">Classement des articles</p>
  </div>
  <button type="button" class="btn btn-primary btn-sm" (click)="nouvelleCategorie()">
    <i-lucide name="plus" size="16"></i-lucide>
    Nouvelle catégorie
  </button>
</div>

<app-confirm-dialog
  [ouvert]="suppressionOuverte"
  titre="Supprimer la catégorie"
  [message]="messageSuppression"
  libelleConfirmer="Supprimer"
  (confirme)="confirmerEtSupprimer()"
  (annule)="annulerSuppression()">
</app-confirm-dialog>

<app-data-table
  entite="catégorie"
  [colonnes]="colonnes"
  [lignes]="listCategory"
  [chargement]="chargement"
  [erreur]="errorMsg !== ''"
  [erreurMessage]="errorMsg || 'Erreur lors du chargement des catégories.'"
  (creer)="nouvelleCategorie()"
  (reessayer)="findAllCategories()"
  (action)="surAction($event)">
</app-data-table>
