<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <div>
    <h1 class="page-title mb-0">Articles</h1>
    <p class="helper-text mb-0">Catalogue de vos articles</p>
  </div>
  <button type="button" class="btn btn-primary btn-sm" (click)="nouvelArticle()">
    <i-lucide name="plus" size="16"></i-lucide>
    Nouvel article
  </button>
</div>

<app-confirm-dialog
  [ouvert]="suppressionOuverte"
  titre="Supprimer l'article"
  [message]="messageSuppression"
  libelleConfirmer="Supprimer"
  (confirme)="confirmerSuppression()"
  (annule)="annulerSuppression()">
</app-confirm-dialog>

<app-data-table
  entite="article"
  [colonnes]="colonnes"
  [lignes]="articlesFiltres"
  [chargement]="chargement"
  [erreur]="errorMsg !== ''"
  [erreurMessage]="errorMsg || 'Erreur lors du chargement des articles.'"
  (creer)="nouvelArticle()"
  (reessayer)="findAllArticle()"
  (action)="surAction($event)">
</app-data-table>
