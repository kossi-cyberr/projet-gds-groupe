<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <div>
    <h1 class="page-title mb-0">Utilisateurs</h1>
    <p class="helper-text mb-0">Comptes et rôles de votre entreprise</p>
  </div>
  <button type="button" class="btn btn-primary btn-sm" (click)="nouvelUtilisateur()">
    <i-lucide name="plus" size="16"></i-lucide>
    Nouvel utilisateur
  </button>
</div>

<app-confirm-dialog
  [ouvert]="suppressionOuverte"
  titre="Supprimer l'utilisateur"
  [message]="messageSuppression"
  libelleConfirmer="Supprimer"
  (confirme)="confirmerSuppression()"
  (annule)="annulerSuppression()">
</app-confirm-dialog>

<app-data-table
  entite="utilisateur"
  [colonnes]="colonnes"
  [lignes]="listUtilisateur"
  [chargement]="chargement"
  [erreur]="errorMsg !== ''"
  [erreurMessage]="errorMsg || 'Erreur lors du chargement des utilisateurs.'"
  (creer)="nouvelUtilisateur()"
  (reessayer)="findAllUtilisateurs()"
  (action)="surAction($event)">
</app-data-table>
