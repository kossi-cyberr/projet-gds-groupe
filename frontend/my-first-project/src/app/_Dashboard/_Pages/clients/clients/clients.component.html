<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <div>
    <h1 class="page-title mb-0">Clients</h1>
    <p class="helper-text mb-0">Gérez les clients de votre entreprise</p>
  </div>
  <button type="button" class="btn btn-primary btn-sm" (click)="noveauClient()">
    <i-lucide name="plus" size="16"></i-lucide>
    Nouveau client
  </button>
</div>

<app-confirm-dialog
  [ouvert]="suppressionOuverte"
  titre="Supprimer le client"
  [message]="messageSuppression"
  libelleConfirmer="Supprimer"
  (confirme)="confirmerSuppression()"
  (annule)="annulerSuppression()">
</app-confirm-dialog>

<app-data-table
  entite="client"
  [colonnes]="colonnes"
  [lignes]="listClient"
  [chargement]="chargement"
  [erreur]="errorMsg !== ''"
  [erreurMessage]="errorMsg || 'Erreur lors du chargement des clients.'"
  (creer)="noveauClient()"
  (reessayer)="findAllClients()"
  (action)="surAction($event)">
</app-data-table>
