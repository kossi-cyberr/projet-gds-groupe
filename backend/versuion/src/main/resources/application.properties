server.port=8089

# Connexion PostgreSQL (variables d'env pour Docker, valeurs par défaut pour dev local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/inventory_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration Hibernate pour PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Conservation de l'intercepteur spécifique au projet et du pathmatch
spring.jpa.properties.hibernate.ejb.interceptor=com.example.versuion.interceptor.Interceptor
spring.mvc.pathmatch.matching-strategy=ant-path-matcher