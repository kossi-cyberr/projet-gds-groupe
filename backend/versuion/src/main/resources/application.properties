server.port=8089

# Connexion PostgreSQL (variables d'env pour Docker, valeurs par défaut pour dev local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/inventory_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration Hibernate pour PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Migrations Flyway (baseline pour ne pas casser les bases existantes)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT (expiration par défaut : 8 heures)
jwt.secret=${JWT_SECRET:ChangezMoi_CetteCleSecreteJWT_DoitFaireAuMoins32Caracteres}
jwt.expiration=${JWT_EXPIRATION:28800000}

# Email SMTP (laisser vide pour désactiver les envois réels, ex: en dev)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Destinataire des alertes de stock faible + cadence (cron : 0 0 8 * * * = tous les jours à 8h)
app.alert.email=${ALERT_EMAIL:}
app.stock-alert.cron=${STOCK_ALERT_CRON:0 0 8 * * *}

# Mot de passe temporaire de l'administrateur créé automatiquement avec l'entreprise
app.entreprise.default-password=${DEFAULT_ADMIN_PASSWORD:Admin123!}

# Photos (stockage local, servi sous /photos/**)
app.photos.dir=${PHOTOS_DIR:./photos}

# Actuator (santé, infos, métriques)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Check SMTP désactivé (SMTP optionnel en dev ; réactivable via env MANAGEMENT_HEALTH_MAIL_ENABLED=true)
management.health.mail.enabled=false
